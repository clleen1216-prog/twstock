name: Taiwan Stock SOP Scanner

on:
  schedule:
    # 台灣時間週一至週五 10:00, 11:00, 12:00, 15:00 執行
    # (對應 UTC 時間分別為 2:00, 3:00, 4:00, 7:00)
    - cron: '0 2,3,4,7 * * 1-5'
  workflow_dispatch: # 支援手動觸發

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas twstock requests

      - name: Run scanner script
        run: |
          python taiwan_stock_pro_scanner.py
